name: Build, Push & Release

on:
    push:
        branches:
            - main
            - dev

jobs:
    build-release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Generate branch-based tag
              id: version
              run: |
                  BRANCH=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
                  SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
                  TAG="${BRANCH}-${SHORT_SHA}"
                  echo "VERSION=$TAG" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      brsktdev/fluxo-webapp:${{ github.ref_name }} # dev ou main

            - name: Create Git Tag (only on main)
              if: github.ref_name == 'main'
              run: |
                  curl -X POST https://api.github.com/repos/${{ github.repository }}/git/refs \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d @- <<EOF
                  {
                    "ref": "refs/tags/${{ steps.version.outputs.VERSION }}",
                    "sha": "${{ github.sha }}"
                  }
                  EOF

            - name: Create GitHub Release (only on main)
              if: github.ref_name == 'main'
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.version.outputs.VERSION }}
                  name: ${{ steps.version.outputs.VERSION }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
